name: Valgrind Analysis

on:
  workflow_call:
  workflow_dispatch:

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  LLVM_VERSION: 16

jobs:
  essential-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-${{ env.LLVM_VERSION }} \
            libtbb-dev \
            valgrind \
            linux-tools-common \
            linux-tools-generic \
            python3-pip \
            libc6-dbg \
            dwarves

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Create Test Log Directory
        run: |
          mkdir -p /tmp/test_logs/
          touch /tmp/test_logs/test.log
          chmod 777 /tmp/test_logs/test.log

      - name: Build Project
        run: |
          echo "Building with debug info..."
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer -fno-inline" \
            -DCMAKE_CXX_STANDARD=23

          cmake --build build/test -j$(nproc)

          echo "Checking debug symbols..."
          file build/test/bin/tests
          nm build/test/bin/tests | grep -i debug || echo "No debug symbols found"

      - name: Cache-Line Alignment Analysis
        run: |
          mkdir -p build/test/reports/alignment

          # Extract struct alignments
          pahole build/test/bin/tests > build/test/reports/alignment/struct_layout.txt

          # Look for potential cache line issues
          grep -n -A 3 -B 3 "size: [4-9][0-9]" build/test/reports/alignment/struct_layout.txt > build/test/reports/alignment/potential_issues.txt || true
          grep -n -A 3 -B 3 "size: [1-9][0-9][0-9]" build/test/reports/alignment/struct_layout.txt >> build/test/reports/alignment/potential_issues.txt || true

          # Check hot structs
          grep -A 20 "Order\|Market\|Price\|Book\|Event" build/test/reports/alignment/struct_layout.txt > build/test/reports/alignment/hot_structs.txt || true

          # Summary
          {
            echo "# Cache-Line Alignment Summary"
            echo "## Potentially Problematic Structs"
            if [ -s build/test/reports/alignment/potential_issues.txt ]; then
              cat build/test/reports/alignment/potential_issues.txt
            else
              echo "No potential issues found"
            fi
            
            echo -e "\n## Hot Domain Structs"
            if [ -s build/test/reports/alignment/hot_structs.txt ]; then
              cat build/test/reports/alignment/hot_structs.txt
            else
              echo "No matching hot structs found"
            fi
          } > build/test/reports/alignment/summary.md

          cat build/test/reports/alignment/summary.md

      - name: Upload Essential Check Results
        uses: actions/upload-artifact@v4
        with:
          name: essential-check-reports
          path: |
            build/test/reports/alignment/
          retention-days: 14
          if-no-files-found: warn

  detailed-analysis:
    needs: essential-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-${{ env.LLVM_VERSION }} \
            libtbb-dev \
            valgrind \
            linux-tools-common \
            linux-tools-generic \
            python3-pip \
            libc6-dbg \
            linux-tools-$(uname -r) || \
            linux-tools-generic

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Create Test Log Directory
        run: |
          mkdir -p /tmp/test_logs/
          touch /tmp/test_logs/test.log
          chmod 777 /tmp/test_logs/test.log

      - name: Build with Performance Flags
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer -march=native" \
            -DCMAKE_CXX_STANDARD=23

          cmake --build build/test -j$(nproc)

      - name: Verify Tools
        run: |
          valgrind --version || {
            echo "Valgrind not installed properly"
            exit 1
          }

          sudo sysctl -w kernel.perf_event_paranoid=1 || echo "Could not adjust perf settings"
          sudo perf --version || {
            echo "Perf not installed properly"
            echo "Attempting alternative installation..."
            sudo apt-get install -y linux-tools-generic
            sudo perf --version || echo "Perf still not available"
          }

      - name: CPU Profile Analysis
        working-directory: build/test
        run: |
          mkdir -p reports/callgrind
          sudo valgrind \
            --tool=callgrind \
            --dump-instr=yes \
            --collect-jumps=yes \
            --callgrind-out-file=reports/callgrind/profile.out \
            ./bin/tests || exit 1

          sudo chmod 644 reports/callgrind/profile.out 

          sudo callgrind_annotate \
            --auto=yes \
            --context=8 \
            reports/callgrind/profile.out > reports/callgrind/analysis.txt || exit 1

      - name: Cache Analysis
        working-directory: build/test
        run: |
          mkdir -p reports/cachegrind
          # Create a log directory with proper permissions
          mkdir -p /tmp/valgrind_logs
          chmod 777 /tmp/valgrind_logs
          # Use sudo to ensure proper permissions
          sudo valgrind \
            --tool=cachegrind \
            --branch-sim=yes \
            --cache-sim=yes \
            --cachegrind-out-file=reports/cachegrind/cache.out \
            ./bin/tests || exit 1

          sudo chmod 644 reports/cachegrind/cache.out
          cg_annotate \
            reports/cachegrind/cache.out > reports/cachegrind/analysis.txt || exit 1

      - name: Memory Usage Profile
        working-directory: build/test
        run: |
          mkdir -p reports/massif
          sudo valgrind \
            --tool=massif \
            --heap=yes \
            --detailed-freq=10 \
            --massif-out-file=reports/massif/heap.out \
            ./bin/tests || exit 1

          ms_print reports/massif/heap.out > reports/massif/analysis.txt || exit 1

      - name: CPU Performance Counters
        working-directory: build/test
        run: |
          mkdir -p reports/perf

          # Try to run perf with falling back to less detailed analysis if permissions are an issue
          sudo perf stat -d -d -d ./bin/tests 2> reports/perf/counters.txt || \
          sudo perf stat ./bin/tests 2> reports/perf/counters.txt || \
          echo "Perf could not run due to permissions or availability issues" > reports/perf/counters.txt

          # Try to get a sample profile for hotspots
          sudo perf record -F 99 -g ./bin/tests -o reports/perf/perf.data 2> reports/perf/record.txt || true

          # Generate a report if the record was successful
          if [ -f "reports/perf/perf.data" ]; then
            sudo perf report -i reports/perf/perf.data --stdio > reports/perf/hotspots.txt 2>/dev/null || true
          fi

      - name: Generate Summary Report
        working-directory: build/test
        run: |
          mkdir -p reports

          append_if_exists() {
            local file=$1
            local section=$2
            echo "## $section" >> performance_summary.md
            echo "\`\`\`" >> performance_summary.md
            if [ -f "$file" ]; then
              head -n 20 "$file" >> performance_summary.md || echo "No data available" >> performance_summary.md
            else
              echo "File not found: $file" >> performance_summary.md
            fi
            echo "\`\`\`" >> performance_summary.md
            echo >> performance_summary.md
          }

          echo "# Performance Analysis Summary" > performance_summary.md
          echo "==========================" >> performance_summary.md
          echo >> performance_summary.md

          echo "## Memory Check Results" >> performance_summary.md
          echo "Memory checks handled by Address Sanitizer in separate workflow" >> performance_summary.md
          echo >> performance_summary.md

          append_if_exists "reports/callgrind/analysis.txt" "CPU Hotspots"
          append_if_exists "reports/cachegrind/analysis.txt" "Cache Performance"
          append_if_exists "reports/massif/analysis.txt" "Memory Usage Patterns"
          append_if_exists "reports/perf/counters.txt" "CPU Performance Counters"
          append_if_exists "reports/perf/hotspots.txt" "Execution Hotspots"

      - name: Detailed Analysis
        working-directory: build/test
        run: |
          echo "Starting detailed analysis..."

          echo "Checking directory structure:"
          find reports -type d -ls || echo "No reports directory found"

          echo "Checking all result files:"
          find reports -type f -ls || echo "No report files found"

          echo "Performance file checks:"
          for type in callgrind cachegrind massif perf; do
            echo "Checking $type results:"
            find reports -path "*/$type/*" -type f 2>/dev/null | while read f; do
              if [ -f "$f" ]; then
                echo "Found $type file: $f"
                echo "File size: $(stat -f%z "$f" 2>/dev/null || stat --format="%s" "$f") bytes"
                echo "File type: $(file "$f")"
                echo "First 20 lines:"
                head -n 20 "$f"
              fi
            done || echo "No $type files found"
          done

          {
            echo "# Analysis Results Summary"
            echo "## Directory Structure"
            find reports -type d 2>/dev/null | sed 's/^/    /' || echo "    No directories found"
            
            echo "## Performance Results"
            for type in callgrind cachegrind massif perf; do
              echo "### $type Results"
              if find reports -path "*/$type/*" 2>/dev/null | grep -q .; then
                find reports -path "*/$type/*" | sed 's/^/    /'
              else
                echo "No $type results found"
              fi
            done
          } > ../detailed_analysis_summary.md

          cat ../detailed_analysis_summary.md

      - name: Upload Detailed Analysis Results
        uses: actions/upload-artifact@v4
        with:
          name: detailed-analysis-reports
          path: |
            build/test/reports/
            build/test/performance_summary.md
          retention-days: 14

  analyze-results:
    needs: [detailed-analysis]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Analysis Reports
        uses: actions/download-artifact@v4
        with:
          path: analysis-results

      - name: Download Cache Alignment Results
        uses: actions/download-artifact@v4
        with:
          name: essential-check-reports
          path: analysis-results/alignment-reports

      - name: Generate Combined Report
        run: |
          echo "# Performance Analysis Report" > combined_report.md
          echo "## Cache-Line Alignment Analysis" >> combined_report.md

          if [ -f "analysis-results/alignment-reports/alignment/summary.md" ]; then
            cat "analysis-results/alignment-reports/alignment/summary.md" >> combined_report.md
          else
            echo "Cache-line alignment analysis not available" >> combined_report.md
          fi

          echo -e "\n## CPU Performance" >> combined_report.md
          if [ -f "analysis-results/detailed-analysis-reports/reports/callgrind/analysis.txt" ]; then
            echo "\`\`\`" >> combined_report.md
            head -n 20 "analysis-results/detailed-analysis-reports/reports/callgrind/analysis.txt" >> combined_report.md
            echo "\`\`\`" >> combined_report.md
          else
            echo "CPU profiling data not available" >> combined_report.md
          fi

          echo -e "\n## Cache Performance" >> combined_report.md
          if [ -f "analysis-results/detailed-analysis-reports/reports/cachegrind/analysis.txt" ]; then
            echo "\`\`\`" >> combined_report.md
            head -n 20 "analysis-results/detailed-analysis-reports/reports/cachegrind/analysis.txt" >> combined_report.md
            echo "\`\`\`" >> combined_report.md
          else
            echo "Cache performance data not available" >> combined_report.md
          fi

          echo -e "\n## Memory Usage" >> combined_report.md
          if [ -f "analysis-results/detailed-analysis-reports/reports/massif/analysis.txt" ]; then
            echo "\`\`\`" >> combined_report.md
            head -n 20 "analysis-results/detailed-analysis-reports/reports/massif/analysis.txt" >> combined_report.md
            echo "\`\`\`" >> combined_report.md
          else
            echo "Memory usage data not available" >> combined_report.md
          fi

          echo -e "\n## Hardware Performance Counters" >> combined_report.md
          if [ -f "analysis-results/detailed-analysis-reports/reports/perf/counters.txt" ]; then
            echo "\`\`\`" >> combined_report.md
            cat "analysis-results/detailed-analysis-reports/reports/perf/counters.txt" >> combined_report.md
            echo "\`\`\`" >> combined_report.md
          else
            echo "Performance counter data not available" >> combined_report.md
          fi

          cat combined_report.md

      - name: Upload Combined Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-analysis-report
          path: combined_report.md
          retention-days: 30
