name: Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-coverage-gcc-${{ hashFiles('vcpkg.json', 'triplets/**', 'cmake/toolchain/**', 'scripts/bootstrap.sh') }}
          restore-keys: vcpkg-coverage-gcc-

      - name: Bootstrap
        run: scripts/bootstrap.sh

      - name: Configure
        run: cmake --preset coverage-gcc

      - name: Test and report coverage
        run: cmake --build --preset coverage-gcc --target coverage

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./build/coverage-gcc/coverage/lcov.info
          fail_ci_if_error: true
          verbose: true

      - name: Skip Codecov upload
        if: env.CODECOV_TOKEN == ''
        run: |
          echo "CODECOV_TOKEN is not configured; coverage report artifacts were still generated."

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: build/coverage-gcc/coverage/lcov.info
          retention-days: 14
