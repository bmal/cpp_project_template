name: Coverage

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-coverage

      - name: Cache CPM Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: cpm-${{ runner.os }}-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcc g++

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DENABLE_BENCHMARKS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fno-inline" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build/test -j$(nproc)

      - name: Run tests with coverage
        working-directory: build/test
        run: |
          # Run functional tests only
          ./functional/TradingTests

          # Show generated coverage files for debugging
          find . -name "*.gcno" -o -name "*.gcda"

          # Generate baseline coverage data
          lcov --capture --initial --directory . \
               --output-file coverage_base.info \
               --rc branch_coverage=1

          # Capture coverage after tests
          lcov --capture --directory . \
               --output-file coverage_test.info \
               --rc branch_coverage=1

          # Combine baseline and test coverage
          lcov --add-tracefile coverage_base.info \
               --add-tracefile coverage_test.info \
               --output-file coverage_total.info \
               --rc branch_coverage=1

          # Remove unwanted coverage data
          lcov --remove coverage_total.info \
               '/usr/*' \
               '*/test/*' \
               '*/benchmark/*' \
               '*/cpm_modules/*' \
               '*/build/*' \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors empty,unused

          # Generate HTML report
          genhtml coverage.info \
                  --output-directory coverage_report \
                  --branch-coverage \
                  --rc branch_coverage=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/test/coverage.info
          fail_ci_if_error: true
          verbose: true

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/test/coverage_report/
          retention-days: 14

      - name: Upload Raw Coverage Data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/test/coverage*.info
            build/test/CMakeFiles/CMakeOutput.log
            build/test/CMakeFiles/CMakeError.log
          retention-days: 7
