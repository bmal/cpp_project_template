name: Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-coverage-gcc-${{ hashFiles('vcpkg.json', 'triplets/**', 'cmake/toolchain/**', 'scripts/bootstrap.sh') }}
          restore-keys: vcpkg-coverage-gcc-

      - name: Bootstrap
        run: |
          scripts/bootstrap.sh
          sudo apt-get install -y lcov

      - name: Configure
        run: cmake --preset coverage-gcc

      - name: Build
        run: cmake --build --preset coverage-gcc

      - name: Run tests with coverage
        working-directory: build/coverage-gcc
        run: |
          # gcov must match the g++ the toolchain picked, for example g++-14 -> gcov-14.
          GCOV_TOOL=$(sed -n 's/^set(CMAKE_CXX_COMPILER "\(.*\)")$/\1/p' CMakeFiles/*/CMakeCXXCompiler.cmake | sed 's/g++\([^/]*\)$/gcov\1/')
          test -x "$GCOV_TOOL"
          echo "gcov tool: $GCOV_TOOL"
          LCOV_ARGS=(
            --rc branch_coverage=1
            --ignore-errors mismatch
            --gcov-tool "$GCOV_TOOL"
          )
          LCOV_FILTER_ARGS=(
            --rc branch_coverage=1
            --ignore-errors mismatch,empty,unused
          )
          COVERAGE_DIR_ARGS=()

          while IFS= read -r dir; do
            COVERAGE_DIR_ARGS+=(--directory "$dir")
          done < <(
            # Every module and unit test object directory under libs/ that has gcov notes.
            find ./libs -name '*.gcno' | sed 's|\(.*\.dir\)/.*|\1|' | sort -u
          )

          if [ "${#COVERAGE_DIR_ARGS[@]}" -eq 0 ]; then
            echo "No module or unit test object directories found" >&2
            exit 1
          fi

          # Generate baseline coverage data before running tests.
          lcov --capture --initial \
               "${COVERAGE_DIR_ARGS[@]}" \
               --output-file coverage_base.info \
               "${LCOV_ARGS[@]}"

          ctest --test-dir . --label-regex unit

          # Show generated coverage files for debugging
          find . -name "*.gcno" -o -name "*.gcda"

          # Capture coverage after tests
          lcov --capture \
               "${COVERAGE_DIR_ARGS[@]}" \
               --output-file coverage_test.info \
               "${LCOV_ARGS[@]}"

          # Combine baseline and test coverage
          lcov --add-tracefile coverage_base.info \
               --add-tracefile coverage_test.info \
               --output-file coverage_total.info \
               "${LCOV_ARGS[@]}"

          # Remove unwanted coverage data
          lcov --remove coverage_total.info \
               '/usr/*' \
               '*/tests/*' \
               '*/benchmarks/*' \
               '*/vcpkg_installed/*' \
               '*/build/*' \
               --output-file coverage.info \
               "${LCOV_FILTER_ARGS[@]}"

          # Generate HTML report
          genhtml coverage.info \
                  --output-directory coverage_report \
                  --branch-coverage \
                  --rc branch_coverage=1 \
                  --ignore-errors empty

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./build/coverage-gcc/coverage.info
          fail_ci_if_error: true
          verbose: true

      - name: Skip Codecov upload
        if: env.CODECOV_TOKEN == ''
        run: |
          echo "CODECOV_TOKEN is not configured; coverage report artifacts were still generated."

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-gcc/coverage_report/
          retention-days: 14

      - name: Upload Raw Coverage Data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/coverage-gcc/coverage*.info
            build/coverage-gcc/CMakeFiles/CMakeOutput.log
            build/coverage-gcc/CMakeFiles/CMakeError.log
          retention-days: 7
