name: Coverage

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcc g++

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/test -j$(nproc)

      - name: Run tests with coverage
        working-directory: build/test
        run: |
          ctest --output-on-failure
          lcov --capture --directory . \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --exclude '/usr/*' \
               --exclude '*/test/*' \
               --ignore-errors empty,unused

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3 # Note: Stay with v3 for now
        with:
          files: ./build/test/coverage.info
          fail_ci_if_error: true
