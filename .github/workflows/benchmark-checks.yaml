name: Benchmark Checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-Release-Benchmark

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            linux-tools-common \
            linux-tools-generic \
            cpufrequtils \
            util-linux \
            procps

      - name: System Information
        run: |
          echo "=== CPU Information ==="
          lscpu | grep -E "Model name|CPU\(s\)|Thread|CPU MHz"

          echo "=== Memory Info ==="
          free -h | grep "Mem:"

      - name: Bootstrap
        run: scripts/bootstrap.sh

      - name: Configure
        run: |
          cmake --preset bench -B build/test \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build/test -j$(nproc) --verbose

      - name: Setup CPU for benchmarking
        run: |
          if [ -d "/sys/devices/system/cpu/cpu0/cpufreq" ]; then
            echo "Setting CPU governor to performance mode..."
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo performance | sudo tee $cpu || echo "Failed to set governor for $cpu"
            done
          fi

      - name: Run Benchmarks
        working-directory: build/test
        run: |
          echo "=== Running Benchmarks ==="
          ./bin/parser_benchmarks \
            --benchmark_format=console \
            --benchmark_repetitions=10 \
            --benchmark_min_time=2s \
            --benchmark_counters_tabular=true \
            --benchmark_display_aggregates_only=true \
            --benchmark_report_aggregates_only=true \
            --benchmark_color=true \
            --v=0 2>&1 | tee benchmark_results.txt

          # Create a simplified summary
          echo -e "\n=== Summary ===" >> benchmark_results.txt
          echo "Registered Benchmark Results:" >> benchmark_results.txt
          grep "_mean" benchmark_results.txt | \
            awk '{ printf "%-30s Time: %12.2f ns    Throughput: %12.2f ops/sec\n", $1, $3, $5 }' \
            >> benchmark_results.txt

      - name: Display Results
        run: cat build/test/benchmark_results.txt

      - name: Store Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/test/benchmark_results.txt
          retention-days: 7

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const results = fs.readFileSync('build/test/benchmark_results.txt', 'utf8');
            const summary = '```\n' + results + '\n```';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: summary
            });
