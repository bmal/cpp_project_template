name: Performance Checks

on:
  workflow_call:

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  VALGRIND_VERSION: 3.19.0
  LLVM_VERSION: 15

jobs:
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          # System packages
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            libc++-${{ env.LLVM_VERSION }}-dev \
            libc++abi-${{ env.LLVM_VERSION }}-dev \
            libtbb-dev \
            python3-pip \
            graphviz \
            libxml2-utils

          # Valgrind installation
          wget -q https://sourceware.org/pub/valgrind/valgrind-${{ env.VALGRIND_VERSION }}.tar.bz2
          tar xf valgrind-${{ env.VALGRIND_VERSION }}.tar.bz2
          cd valgrind-${{ env.VALGRIND_VERSION }}
          ./configure CC=clang-${{ env.LLVM_VERSION }} CXX=clang++-${{ env.LLVM_VERSION }}
          make -j$(nproc) && sudo make install
          cd ..

          # Python packages
          pip install --upgrade pip gprof2dot==2021.2.21

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: valgrind-${{ runner.os }}-clang${{ env.LLVM_VERSION }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Setup Environment
        run: |
          # Create valgrind suppression rules
          cat > valgrind.supp << 'EOF'
          {
             ignore_libcxx_leaks
             Memcheck:Leak
             ...
             obj:*/libc++.so.*
          }
          {
             ignore_llvm_leaks
             Memcheck:Leak
             ...
             obj:*/libLLVM*.so.*
          }
          EOF

          # Create XML parser script
          cat > parse_valgrind.py << 'EOF'
          #!/usr/bin/env python3
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def parse_valgrind_xml(xml_file):
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  
                  errors = root.findall('.//error')
                  leak_summary = root.find('.//leak_summary')
                  
                  print(f"\nResults for: {xml_file}")
                  print("-" * 50)
                  
                  if errors:
                      print("\nErrors found:")
                      for error in errors:
                          kind = error.find('kind').text
                          what = error.find('what')
                          what_text = what.text if what is not None else "Unknown error"
                          print(f"- {kind}: {what_text}")
                  
                  if leak_summary is not None:
                      print("\nLeak Summary:")
                      for line in leak_summary.text.split('\n'):
                          if line.strip():
                              print(f"  {line.strip()}")
                  
                  return bool(errors or (leak_summary is not None and 'definitely lost: 0' not in leak_summary.text))
              except Exception as e:
                  print(f"Error parsing {xml_file}: {e}")
                  return False

          def main():
              has_issues = False
              for xml_file in Path('reports/memcheck').glob('*.xml'):
                  if parse_valgrind_xml(xml_file):
                      has_issues = True
              sys.exit(1 if has_issues else 0)

          if __name__ == "__main__":
              main()
          EOF

          chmod +x parse_valgrind.py
          mkdir -p build/reports/{memcheck,perf,summaries}

      - name: Build Project
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_FLAGS="-g3 -fno-inline-functions -fno-optimize-sibling-calls -fno-omit-frame-pointer -O1 -glldb -std=c++2b" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld" \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=ON

          cmake --build build -j$(nproc)

      - name: Run Memory Analysis
        working-directory: build
        continue-on-error: true
        run: |
          echo "::group::Memory Check"
          ctest -T memcheck \
            --output-on-failure \
            --parallel $(nproc) \
            --timeout 300 \
            --overwrite MemoryCheckCommand=/usr/local/bin/valgrind \
            --overwrite MemoryCheckCommandOptions="\
              --tool=memcheck \
              --leak-check=full \
              --show-leak-kinds=all \
              --track-origins=yes \
              --num-callers=50 \
              --error-exitcode=1 \
              --xml=yes \
              --xml-file=reports/memcheck/test-\${TEST_NAME}.xml \
              --suppressions=../valgrind.supp \
              --demangle=yes"
          echo "::endgroup::"

      - name: Run Performance Analysis
        if: always()
        working-directory: build
        continue-on-error: true
        run: |
          echo "::group::Performance Analysis"
          for bench in $(find . -type f -executable -name '*Benchmark'); do
            name=$(basename $bench)
            
            echo "Running Callgrind analysis for $name"
            timeout 20m valgrind --tool=callgrind \
              --dump-instr=yes \
              --collect-jumps=yes \
              --collect-systime=yes \
              --callgrind-out-file=reports/perf/${name}_callgrind.out \
              --fn-skip="__cxx_*" \
              --fn-skip="std::*" \
              $bench
            
            echo "Running Cachegrind analysis for $name"
            timeout 20m valgrind --tool=cachegrind \
              --branch-sim=yes \
              --I1=32768,8,64 \
              --D1=32768,8,64 \
              --LL=8388608,16,64 \
              --cachegrind-out-file=reports/perf/${name}_cachegrind.out \
              $bench
          done
          echo "::endgroup::"

      - name: Generate Reports
        if: always()
        working-directory: build
        run: |
          # Process memory check results
          python3 ../parse_valgrind.py > reports/summaries/memory_summary.txt

          # Process performance results
          for report in reports/perf/*_callgrind.out; do
            name=$(basename "$report" _callgrind.out)
            callgrind_annotate --auto=yes --tree=both "$report" | c++filt > "reports/summaries/${name}_callgrind.txt"
            gprof2dot -f callgrind "$report" | dot -Tsvg > "reports/summaries/${name}_callgraph.svg"
          done

          for report in reports/perf/*_cachegrind.out; do
            name=$(basename "$report" _cachegrind.out)
            cg_annotate "$report" | c++filt > "reports/summaries/${name}_cachegrind.txt"
          done

          # Create summary report
          {
            echo "=== Memory Analysis Summary ==="
            cat reports/summaries/memory_summary.txt
            echo -e "\n=== Performance Analysis Summary ==="
            for f in reports/summaries/*_callgrind.txt; do
              echo -e "\n--- $(basename "$f") ---"
              head -n 20 "$f"
            done
          } > reports/summary.txt

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            build/reports/summaries/
            valgrind.supp
          retention-days: 14

      - name: Check for Leaks
        if: always()
        working-directory: build
        run: |
          if grep -q "definitely lost: [1-9][0-9]*" reports/summaries/memory_summary.txt; then
            echo "::error::Memory leaks detected!"
            exit 1
          fi
