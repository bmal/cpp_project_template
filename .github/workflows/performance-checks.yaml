name: Performance Analysis

on:
  workflow_call:

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  LLVM_VERSION: 16

jobs:
  essential-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valgrind \
            linux-tools-common \
            linux-tools-generic \
            python3-pip \
            graphviz

      - name: Build Project
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_STANDARD=23

          cmake --build build -j$(nproc)

      - name: Memory Checks
        working-directory: build
        run: |
          mkdir -p reports/memcheck
          valgrind \
            --tool=memcheck \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --xml=yes \
            --xml-file=reports/memcheck/results.xml \
            ./TradingTests

      - name: Thread Safety Analysis
        working-directory: build
        run: |
          mkdir -p reports/helgrind
          valgrind \
            --tool=helgrind \
            --xml=yes \
            --xml-file=reports/helgrind/results.xml \
            ./TradingTests

      - name: Upload Essential Check Results
        uses: actions/upload-artifact@v4
        with:
          name: essential-check-reports
          path: build/reports/
          retention-days: 14

  detailed-analysis:
    needs: essential-checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3

      - name: Build with Performance Flags
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer -march=native" \
            -DCMAKE_CXX_STANDARD=23

          cmake --build build -j$(nproc)

      - name: CPU Profile Analysis
        working-directory: build
        run: |
          mkdir -p reports/callgrind
          valgrind \
            --tool=callgrind \
            --dump-instr=yes \
            --collect-jumps=yes \
            --callgrind-out-file=reports/callgrind/profile.out \
            ./TradingTests

          callgrind_annotate \
            --auto=yes \
            --context=8 \
            reports/callgrind/profile.out > reports/callgrind/analysis.txt

      - name: Cache Analysis
        working-directory: build
        run: |
          mkdir -p reports/cachegrind
          valgrind \
            --tool=cachegrind \
            --branch-sim=yes \
            --cache-sim=yes \
            --cachegrind-out-file=reports/cachegrind/cache.out \
            ./TradingTests

          cg_annotate \
            reports/cachegrind/cache.out > reports/cachegrind/analysis.txt

      - name: Memory Usage Profile
        working-directory: build
        run: |
          mkdir -p reports/massif
          valgrind \
            --tool=massif \
            --heap=yes \
            --detailed-freq=10 \
            --massif-out-file=reports/massif/heap.out \
            ./TradingTests

          ms_print reports/massif/heap.out > reports/massif/analysis.txt

      - name: Generate Summary Report
        working-directory: build
        run: |
          echo "Performance Analysis Summary" > performance_summary.md
          echo "==========================" >> performance_summary.md
          echo >> performance_summary.md

          echo "## Memory Check Results" >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md
          grep -A 5 "definitely lost:" reports/memcheck/results.xml >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md

          echo "## Thread Safety Issues" >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md
          grep -A 5 "<error>" reports/helgrind/results.xml >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md

          echo "## CPU Hotspots" >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md
          head -n 20 reports/callgrind/analysis.txt >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md

          echo "## Cache Performance" >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md
          head -n 20 reports/cachegrind/analysis.txt >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md

          echo "## Memory Usage Patterns" >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md
          head -n 20 reports/massif/analysis.txt >> performance_summary.md
          echo "\`\`\`" >> performance_summary.md

      - name: Upload Detailed Analysis Results
        uses: actions/upload-artifact@v4
        with:
          name: detailed-analysis-reports
          path: |
            build/reports/
            build/performance_summary.md
          retention-days: 14

  analyze-results:
    needs: [detailed-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Download Analysis Reports
        uses: actions/download-artifact@v4
        with:
          path: analysis-results

      - name: Check for Critical Issues
        run: |
          if grep -q "definitely lost:" analysis-results/*/reports/memcheck/results.xml; then
            echo "::error::Memory leaks detected"
            exit 1
          fi

          if grep -q "Race condition" analysis-results/*/reports/helgrind/results.xml; then
            echo "::error::Race conditions detected"
            exit 1
          fi
