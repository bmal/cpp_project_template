name: Performance Checks

on:
  workflow_call:

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  VALGRIND_VERSION: 3.19.0
  LLVM_VERSION: 16

jobs:
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          # Add LLVM repository
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ env.LLVM_VERSION }} main"

          # Update package lists
          sudo apt-get update

          # Install required packages
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            clang-tools-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            lldb-${{ env.LLVM_VERSION }} \
            libc++-${{ env.LLVM_VERSION }}-dev \
            libc++abi-${{ env.LLVM_VERSION }}-dev \
            libunwind-${{ env.LLVM_VERSION }}-dev \
            libclang-rt-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev \
            libllvm-${{ env.LLVM_VERSION }}-ocaml-dev \
            llvm-${{ env.LLVM_VERSION }}-dev \
            llvm-${{ env.LLVM_VERSION }}-runtime \
            libtbb-dev \
            python3-pip \
            graphviz \
            libxml2-utils \
            ninja-build

          # Ensure all LLVM components are properly linked
          sudo ln -sf /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib/clang /usr/lib/clang

          # Set up alternatives for LLVM tools
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-${{ env.LLVM_VERSION }} 100

          # Set up alternatives for libraries
          sudo update-alternatives --install /usr/lib/libc++.so.1 libc++ /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib/libc++.so.1 100
          sudo update-alternatives --install /usr/lib/libc++abi.so.1 libc++abi /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib/libc++abi.so.1 100

          # Install Valgrind from source
          wget -q https://sourceware.org/pub/valgrind/valgrind-${{ env.VALGRIND_VERSION }}.tar.bz2
          tar xf valgrind-${{ env.VALGRIND_VERSION }}.tar.bz2
          cd valgrind-${{ env.VALGRIND_VERSION }}
          ./configure CC=clang-${{ env.LLVM_VERSION }} CXX=clang++-${{ env.LLVM_VERSION }}
          make -j$(nproc) && sudo make install
          cd ..

          # Install Python dependencies
          python3 -m pip install --upgrade pip
          python3 -m pip install gprof2dot==2021.2.21

          # Verify installations
          clang++ --version
          ld.lld --version || true  # Don't fail if version check fails

          # Display LLVM installation information
          ls -l /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib/
          ls -l /usr/lib/clang/

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: valgrind-${{ runner.os }}-clang${{ env.LLVM_VERSION }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Setup Environment
        run: |
          # Create valgrind suppression rules
          cat > valgrind.supp << 'EOF'
          {
             ignore_libcxx_leaks
             Memcheck:Leak
             ...
             obj:*/libc++.so.*
          }
          {
             ignore_llvm_leaks
             Memcheck:Leak
             ...
             obj:*/libLLVM*.so.*
          }
          EOF

          # Create XML parser script
          cat > parse_valgrind.py << 'EOF'
          #!/usr/bin/env python3
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def parse_valgrind_xml(xml_file):
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  
                  errors = root.findall('.//error')
                  leak_summary = root.find('.//leak_summary')
                  
                  print(f"\nResults for: {xml_file}")
                  print("-" * 50)
                  
                  if errors:
                      print("\nErrors found:")
                      for error in errors:
                          kind = error.find('kind').text
                          what = error.find('what')
                          what_text = what.text if what is not None else "Unknown error"
                          print(f"- {kind}: {what_text}")
                  
                  if leak_summary is not None:
                      print("\nLeak Summary:")
                      for line in leak_summary.text.split('\n'):
                          if line.strip():
                              print(f"  {line.strip()}")
                  
                  return bool(errors or (leak_summary is not None and 'definitely lost: 0' not in leak_summary.text))
              except Exception as e:
                  print(f"Error parsing {xml_file}: {e}")
                  return False

          def main():
              has_issues = False
              for xml_file in Path('reports/memcheck').glob('*.xml'):
                  if parse_valgrind_xml(xml_file):
                      has_issues = True
              sys.exit(1 if has_issues else 0)

          if __name__ == "__main__":
              main()
          EOF

          chmod +x parse_valgrind.py
          mkdir -p build/reports/{memcheck,perf,summaries}

      - name: Build Project
        run: |
          # Environment setup
          export CC=clang-16
          export CXX=clang++-16
          export CXXFLAGS="-stdlib=libc++"
          export LDFLAGS="-fuse-ld=lld-16"

          # Ensure proper library paths
          export LD_LIBRARY_PATH="/usr/lib/llvm-16/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export LIBRARY_PATH="/usr/lib/llvm-16/lib:/usr/lib/x86_64-linux-gnu:${LIBRARY_PATH:-}"

          # Configure with correct flags
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-16 \
            -DCMAKE_CXX_FLAGS="-g3 -fno-inline-functions -fno-optimize-sibling-calls -fno-omit-frame-pointer -O1 -glldb -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="\
              -fuse-ld=lld-16 \
              -stdlib=libc++ \
              -L/usr/lib/llvm-16/lib \
              -Wl,-rpath,/usr/lib/llvm-16/lib \
              -lc++ -lc++abi -lunwind -pthread" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_VERBOSE_MAKEFILE=ON

          # Build with verbose output
          cmake --build build -j$(nproc) --verbose

          # Verify the build output
          if [ -f "build/TradingTests" ]; then
            echo -e "\n=== Build Output Information ===" >> $GITHUB_STEP_SUMMARY
            ldd build/TradingTests >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Memory Analysis
        working-directory: build
        continue-on-error: true
        run: |
          echo "::group::Memory Check"
          mkdir -p reports/memcheck

          # Run tests with valgrind
          if [ -f "./TradingTests" ]; then
            echo "Running memory check for TradingTests"
            valgrind \
              --tool=memcheck \
              --leak-check=full \
              --show-leak-kinds=all \
              --track-origins=yes \
              --num-callers=50 \
              --error-exitcode=1 \
              --xml=yes \
              --xml-file="reports/memcheck/TradingTests.xml" \
              --suppressions=../valgrind.supp \
              --demangle=yes \
              ./TradingTests
          else
            echo "No test executable found"
          fi
          echo "::endgroup::"

      - name: Run Performance Analysis
        if: always()
        working-directory: build
        continue-on-error: true
        run: |
          echo "::group::Performance Analysis"
          mkdir -p reports/perf

          # Find benchmark executables
          find . -type f -executable -name '*Benchmark' | while read bench; do
            if [ -x "$bench" ]; then
              name=$(basename "$bench")
              echo "Running Callgrind analysis for $name"
              timeout 20m valgrind --tool=callgrind \
                --dump-instr=yes \
                --collect-jumps=yes \
                --collect-systime=yes \
                --callgrind-out-file="reports/perf/${name}_callgrind.out" \
                --fn-skip="__cxx_*" \
                --fn-skip="std::*" \
                "$bench"
              
              echo "Running Cachegrind analysis for $name"
              timeout 20m valgrind --tool=cachegrind \
                --branch-sim=yes \
                --I1=32768,8,64 \
                --D1=32768,8,64 \
                --LL=8388608,16,64 \
                --cachegrind-out-file="reports/perf/${name}_cachegrind.out" \
                "$bench"
            fi
          done
          echo "::endgroup::"

      - name: Generate Reports
        if: always()
        working-directory: build
        run: |
          # Ensure directory exists
          mkdir -p reports/summaries

          # Process memory check results if any exist
          if [ -d "reports/memcheck" ] && [ "$(ls -A reports/memcheck)" ]; then
            python3 ../parse_valgrind.py > reports/summaries/memory_summary.txt
          else
            echo "No memory check results found" > reports/summaries/memory_summary.txt
          fi

          # Process performance results if any exist
          if [ -d "reports/perf" ] && [ "$(ls -A reports/perf)" ]; then
            # Process Callgrind results
            for report in reports/perf/*_callgrind.out; do
              if [ -f "$report" ]; then
                name=$(basename "$report" _callgrind.out)
                callgrind_annotate --auto=yes --tree=both "$report" | c++filt > "reports/summaries/${name}_callgrind.txt"
                gprof2dot -f callgrind "$report" | dot -Tsvg > "reports/summaries/${name}_callgraph.svg"
              fi
            done

            # Process Cachegrind results
            for report in reports/perf/*_cachegrind.out; do
              if [ -f "$report" ]; then
                name=$(basename "$report" _cachegrind.out)
                cg_annotate "$report" | c++filt > "reports/summaries/${name}_cachegrind.txt"
              fi
            done
          else
            echo "No performance analysis results found" > reports/summaries/perf_summary.txt
          fi

          # Create final summary
          {
            echo "=== Analysis Summary ==="
            echo -e "\nMemory Check Results:"
            cat reports/summaries/memory_summary.txt
            
            if [ -f "reports/summaries/perf_summary.txt" ]; then
              echo -e "\nPerformance Analysis Results:"
              cat reports/summaries/perf_summary.txt
            fi
          } > reports/summaries/summary.txt

      - name: Verify Reports Directory
        if: always()
        run: |
          if [ ! -d build/reports/summaries ]; then
            echo "Reports directory does not exist. Skipping upload."
            exit 0
          fi

      - name: List Files to Upload
        if: always()
        run: ls -lh build/reports/summaries/

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: build/reports/summaries/
          retention-days: 3

      - name: Check for Leaks
        if: always()
        working-directory: build
        run: |
          if grep -q "definitely lost: [1-9][0-9]*" reports/summaries/memory_summary.txt; then
            echo "::error::Memory leaks detected!"
            exit 1
          fi
