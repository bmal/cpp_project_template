name: Coverage

on:
  workflow_run:
    workflows:
      - Build and Test
    types:
      - completed

jobs:
  coverage:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcc g++

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/test -j$(nproc)

      - name: Run tests with coverage
        working-directory: build/test
        run: |
          # Run tests
          ctest --output-on-failure

          # Show generated coverage files for debugging
          find . -name "*.gcno" -o -name "*.gcda"

          # Capture coverage
          lcov --capture --directory . \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --exclude '/usr/*' \
               --exclude '*/test/*' \
               --ignore-errors empty,unused

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/test/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
