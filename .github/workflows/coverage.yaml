name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcc g++

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/test -j$(nproc)

      - name: Check compilation flags
        run: |
          cmake --build build/test --verbose
          find build/test -name "*.gcno" -ls

      - name: Run tests
        working-directory: build/test
        run: |
          ctest --output-on-failure
          find . -name "*.gcda" -ls

      - name: Collect coverage
        working-directory: build/test
        run: |
          lcov --directory . \
               --capture \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors empty \
               --gcov-tool gcov

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: build/test/coverage.info
          fail_ci_if_error: true
