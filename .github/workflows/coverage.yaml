name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lcov \
            gcc \
            g++ \
            git \
            cmake \
            ninja-build

      - name: Configure
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Create coverage baseline
        run: lcov --capture --initial --directory build --output-file coverage.base

      - name: Capture coverage data
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --no-external \
            --exclude '*_deps/*' \
            --exclude '*/build/*' \
            --branch-coverage

      - name: Combine coverage traces
        run: |
          lcov \
            --add-tracefile coverage.base \
            --add-tracefile coverage.info \
            --output-file coverage.total

      - name: Filter coverage data
        run: |
          lcov \
            --remove coverage.total \
            '*/test/*' \
            '*/tests/*' \
            '*/build/*' \
            '*/_deps/*' \
            --output-file coverage.filtered

      - name: List coverage data
        run: lcov --list coverage.filtered

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.filtered
          fail_ci_if_error: true
          verbose: true

      - name: Generate HTML report
        run: genhtml coverage.filtered --output-directory coverage_report

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage_report
          retention-days: 14
