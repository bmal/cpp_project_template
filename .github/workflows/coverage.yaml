name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcc g++

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON

      - name: Build
        run: cmake --build build/test -j$(nproc)

      - name: Run tests
        working-directory: build/test
        run: ctest --output-on-failure

      - name: Collect coverage
        working-directory: build/test
        run: |
          # Reset counters first
          lcov --zerocounters --directory .

          # Initial capture of coverage data
          lcov --capture --directory . \
               --output-file coverage.base \
               --initial \
               --rc branch_coverage=1 \
               --rc geninfo_unexecuted_blocks=1 \
               --rc geninfo_ignore_errors=mismatch,gcov,gcov \
               --no-external

          # Run tests and capture again
          ctest --output-on-failure

          # Capture post-test coverage data
          lcov --capture --directory . \
               --output-file coverage.test \
               --rc branch_coverage=1 \
               --rc geninfo_unexecuted_blocks=1 \
               --rc geninfo_ignore_errors=mismatch,gcov,gcov \
               --no-external

          # Combine coverage data
          lcov --add-tracefile coverage.base \
               --add-tracefile coverage.test \
               --output-file coverage.total \
               --rc branch_coverage=1

          # Remove unwanted coverage data
          lcov --remove coverage.total \
               '/usr/include/*' \
               '*/test/*' \
               '*/_deps/*' \
               '*/build/*' \
               --output-file coverage.info \
               --rc branch_coverage=1

      - name: Generate HTML report
        working-directory: build/test
        run: |
          genhtml coverage.info \
                  --output-directory coverage_report \
                  --rc branch_coverage=1 \
                  --legend \
                  --title "Trading Coverage Report"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: build/test/coverage.info
          fail_ci_if_error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: build/test/coverage_report
