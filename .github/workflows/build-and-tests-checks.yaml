name: Build and tests

on:
  workflow_call:

jobs:
  presets:
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, dev-gcc, release-gcc]
    name: Workflow ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'cmake/toolchain/**', 'scripts/bootstrap.sh') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Bootstrap
        run: scripts/bootstrap.sh

      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Run standalone
        if: matrix.preset == 'dev'
        run: cmake --build --preset dev --target run-standalone

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            .vcpkg/buildtrees/*/*.log
          retention-days: 7
