name: Pipeline

on:
  pull_request:
    branches: [master, main]
  push:
    branches:
      - "**"
      - "!refs/pull/**"
      - "!master"
      - "!main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Sanitizer options
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:print_summary=1
  ASAN_OPTIONS: detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_leaks=1:detect_container_overflow=1
  TSAN_OPTIONS: second_deadlock_stack=1:report_signal_unsafe=1:memory_limit_mb=4096:history_size=7:force_seq_cst_atomics=1
  MSAN_OPTIONS: poison_in_dtor=1:print_summary=1:fail_immediately=1
  LSAN_OPTIONS: print_suppressions=1:report_objects=1
  # Tool versions
  VALGRIND_VERSION: 3.19.0
  LLVM_VERSION: 15

jobs:
  determine-scope:
    runs-on: ubuntu-latest
    outputs:
      run-comprehensive: ${{ steps.check.outputs.run-comprehensive }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "run-comprehensive=true" >> $GITHUB_OUTPUT
          else
            echo "run-comprehensive=false" >> $GITHUB_OUTPUT
          fi

  essential-checks:
    needs: determine-scope
    uses: ./.github/workflows/essential-checks.yaml

  comprehensive-checks:
    needs: [determine-scope, essential-checks]
    if: needs.determine-scope.outputs.run-comprehensive == 'true'
    uses: ./.github/workflows/comprehensive-checks.yaml
    secrets: inherit
