name: Pipeline

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize] # Explicitly define PR event types
  push:
    branches:
      - "**"
    paths-ignore:
      - "refs/pull/**"

permissions:
  checks: write
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Sanitizer options
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:print_summary=1
  ASAN_OPTIONS: detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_leaks=1:detect_container_overflow=1
  TSAN_OPTIONS: second_deadlock_stack=1:report_signal_unsafe=1:memory_limit_mb=4096:history_size=7:force_seq_cst_atomics=1
  MSAN_OPTIONS: poison_in_dtor=1:print_summary=1:fail_immediately=1
  LSAN_OPTIONS: print_suppressions=1:report_objects=1
  LLVM_VERSION: 17

jobs:
  determine-scope:
    # Modified condition to prevent double-triggering on PR pushes
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push' && !contains(github.ref, 'refs/pull/') && !contains(github.ref, 'refs/heads/pull/'))
    runs-on: ubuntu-24.04
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        run: |
          # Determine if this is a PR push or direct push
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && ! "${{ github.ref }}" =~ ^refs/pull/ && ! "${{ github.ref }}" =~ ^refs/heads/pull/ ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

  format:
    needs: determine-scope
    if: needs.determine-scope.outputs.should-run == 'true'
    name: Format and pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: scripts/bootstrap.sh

      - name: Run every hook over every file
        run: |
          "$(pipx environment --value PIPX_BIN_DIR)/pre-commit" run --all-files --show-diff-on-failure

  build-and-tests-checks:
    needs: determine-scope
    if: needs.determine-scope.outputs.should-run == 'true'
    uses: ./.github/workflows/build-and-tests-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read

  coverage-checks:
    needs: [determine-scope, build-and-tests-checks]
    if: needs.determine-scope.outputs.should-run == 'true'
    uses: ./.github/workflows/coverage-checks.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      checks: write
      pull-requests: write
      contents: read

  sanitizer-checks:
    needs: [determine-scope, build-and-tests-checks]
    if: needs.determine-scope.outputs.should-run == 'true'
    uses: ./.github/workflows/sanitizer-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read
