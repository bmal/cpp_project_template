name: Comprehensive Checks

on:
  workflow_call:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  quality-checks:
    uses: ./.github/workflows/quality-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read

  safety-checks:
    uses: ./.github/workflows/sanitizer-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read

  performance-checks:
    uses: ./.github/workflows/valgrind-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read
