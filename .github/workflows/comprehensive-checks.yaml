name: Comprehensive Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  safety-checks:
    uses: ./.github/workflows/sanitizer-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read

  performance-checks:
    uses: ./.github/workflows/valgrind-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read

  benchmarks:
    uses: ./.github/workflows/benchmark-checks.yaml
    permissions:
      checks: write
      pull-requests: write
      contents: read
