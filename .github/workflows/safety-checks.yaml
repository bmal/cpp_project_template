name: Safety Checks

on:
  workflow_call:

jobs:
  run-sanitizers:
    runs-on: ubuntu-latest
    container:
      image: silkeh/clang:15
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: Address
            build_type: Release
            cache_key: asan
          - sanitizer: Thread
            build_type: Release
            cache_key: tsan
          # Memory sanitizer needs all code including stdlib to be instrumented
          # Skipping as it requires custom-built libc++
          # - sanitizer: Memory
          #   build_type: Release
          #   cache_key: msan
          - sanitizer: Undefined
            build_type: Release
            cache_key: ubsan
          - sanitizer: "Address;Undefined" # Note the semicolon separator
            build_type: Debug
            cache_key: asan_ubsan

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            ninja-build \
            libtbb-dev \
            pkg-config

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: "sanitizer-clang15-${{ matrix.cache_key }}-${{ hashFiles('**/CMakeLists.txt') }}"

      - name: Configure Environment
        run: |
          # Set common sanitizer options
          echo "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:print_summary=1" >> $GITHUB_ENV
          echo "ASAN_OPTIONS=detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_leaks=1" >> $GITHUB_ENV
          echo "TSAN_OPTIONS=second_deadlock_stack=1:report_signal_unsafe=1:memory_limit_mb=4096" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_SANITIZER=${{ matrix.sanitizer }} \
            -DCMAKE_CXX_FLAGS="-march=native -mtune=native -fno-omit-frame-pointer -fno-optimize-sibling-calls -stdlib=libstdc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --timeout 300 --repeat until-pass:2 --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.cache_key }}
          path: build/test-results.xml

      - name: Process Sanitizer Results
        if: always()
        run: |
          cd build
          mkdir -p reports/sanitizer

          # Collect all sanitizer output files
          find . -name "*sanitizer*.log" -exec cp {} reports/sanitizer/ \;

          # Create summary
          {
            echo "=== Sanitizer Summary ==="
            echo
            echo "Build Type: ${{ matrix.build_type }}"
            echo "Sanitizer: ${{ matrix.sanitizer }}"
            echo
            echo "=== Log Contents ==="
            find reports/sanitizer -type f -exec cat {} \;
          } > reports/sanitizer_summary.txt

      - name: Upload Sanitizer Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results-${{ matrix.cache_key }}
          path: |
            build/reports/sanitizer/
            build/reports/sanitizer_summary.txt
          retention-days: 7
