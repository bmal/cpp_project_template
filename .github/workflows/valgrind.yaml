name: Valgrind

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev valgrind
      - name: Configure tests
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build/test --target test -- CTEST_OUTPUT_ON_FAILURE=1
      - name: Run tests with Valgrind
        run: |
          cd build/test
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --verbose ./TradingTests
