name: Valgrind

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  BUILD_TYPE: Debug

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache CPM modules
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ runner.os }}-${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev valgrind

      - name: Configure CMake
        run: cmake -S test -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Run Valgrind on test executables
        run: |
          cd build
          for test_executable in $(find . -type f -executable -name '*Tests'); do
            echo "Running Valgrind on $test_executable"
            valgrind --tool=memcheck \
                     --leak-check=full \
                     --show-leak-kinds=all \
                     --track-origins=yes \
                     --verbose \
                     --error-exitcode=1 \
                     --gen-suppressions=all \
                     --suppressions=../valgrind_suppressions.txt \
                     --log-file=valgrind_${test_executable##*/}.log \
                     $test_executable
            if [ $? -ne 0 ]; then
              echo "Valgrind detected errors in $test_executable"
              exit_code=1
            fi
          done
          exit ${exit_code:-0}

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: valgrind-logs
          path: build/valgrind_*.log
