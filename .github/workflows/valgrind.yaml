name: Valgrind

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  BUILD_TYPE: Debug

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache CPM modules
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ runner.os }}-${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev valgrind

      - name: Configure CMake
        run: cmake -S test -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Run tests with Valgrind
        run: |
          cd build
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --verbose \
                   --error-exitcode=1 \
                   --gen-suppressions=all \
                   --suppressions=../valgrind_suppressions.txt \
                   ./TradingTests
        continue-on-error: true

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v3
        with:
          name: valgrind-logs
          path: build/valgrind.log
