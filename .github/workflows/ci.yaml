name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Sanitizer options
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:print_summary=1
  ASAN_OPTIONS: detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_leaks=1:detect_container_overflow=1
  TSAN_OPTIONS: second_deadlock_stack=1:report_signal_unsafe=1:memory_limit_mb=4096:history_size=7:force_seq_cst_atomics=1
  MSAN_OPTIONS: poison_in_dtor=1:print_summary=1:fail_immediately=1
  LSAN_OPTIONS: print_suppressions=1:report_objects=1
  # Tool versions
  VALGRIND_VERSION: 3.19.0
  LLVM_VERSION: 15

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Configure
        run: |
          cmake -S standalone -B build/standalone \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/standalone -j$(nproc)

      - name: Run
        working-directory: build/standalone
        run: ./trading_standalone

  build-and-test:
    needs: standalone
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Ubuntu Debug", os: ubuntu-latest, build_type: Debug }
          - { name: "Ubuntu Release", os: ubuntu-latest, build_type: Release }
          - { name: "macOS Release", os: macos-latest, build_type: Release }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.build_type }}

      - name: Cache CPM Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: cpm-${{ matrix.config.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp tbb ccache

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build/test -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Test
        working-directory: build/test
        run: |
          echo "Available tests:"
          ctest -N
          echo "Running tests:"
          ctest --build-config ${{ matrix.config.build_type }} --output-on-failure --output-junit test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.config.name }}
          path: build/test/test-results.xml

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.config.name }}
          path: |
            build/test/Testing/Temporary/LastTest.log
            build/test/CMakeFiles/CMakeError.log

  quality-checks:
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache LLVM and Clang
        uses: actions/cache@v3
        with:
          path: |
            ./llvm
            ./clang-tools
          key: llvm-${{ runner.os }}

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev llvm clang-tools

      - name: clang-tidy review
        uses: ZedThree/clang-tidy-review@v0.19.0
        if: github.event_name == 'pull_request'
        with:
          cmake_command: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS="-march=native -mtune=native" .
          build_dir: build
          config_file: .clang-tidy
          exclude: "external/**"

      - name: Run clang-tidy directly
        if: github.event_name == 'push'
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS="-march=native -mtune=native"
          run-clang-tidy -p build
  sanitizers:
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: silkeh/clang:15
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: Address
            build_type: Release
          - sanitizer: Thread
            build_type: Release
          - sanitizer: Memory
            build_type: Release
          - sanitizer: Undefined
            build_type: Release
          - sanitizer: "Address,Undefined"
            build_type: Debug

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            ninja-build \
            libtbb-dev \
            pkg-config

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: "sanitizer-clang15-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt') }}"

      - name: Cache Build
        uses: actions/cache@v3
        with:
          path: build
          key: sanitizer-${{ matrix.sanitizer }}-${{ github.sha }}
          restore-keys: |
            sanitizer-${{ matrix.sanitizer }}-

      - name: Configure
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_SANITIZER=${{ matrix.sanitizer }} \
            -DCMAKE_CXX_FLAGS="-march=native -mtune=native -fno-omit-frame-pointer -fno-optimize-sibling-calls -stdlib=libstdc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --timeout 300 --repeat until-pass:2 --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sanitizer }}
          path: build/test-results.xml

      - name: Process Sanitizer Results
        if: always()
        run: |
          cd build
          mkdir -p reports/sanitizer

          # Collect all sanitizer output files
          find . -name "*sanitizer*.log" -exec cp {} reports/sanitizer/ \;

          # Create summary
          {
            echo "=== Sanitizer Summary ==="
            echo
            echo "Build Type: ${{ matrix.build_type }}"
            echo "Sanitizer: ${{ matrix.sanitizer }}"
            echo
            echo "=== Log Contents ==="
            find reports/sanitizer -type f -exec cat {} \;
          } > reports/sanitizer_summary.txt

      - name: Upload Sanitizer Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results-${{ matrix.sanitizer }}
          path: |
            build/reports/sanitizer/
            build/reports/sanitizer_summary.txt
          retention-days: 14
  coverage:
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcc g++

      - name: Configure
        run: |
          cmake -S test -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/test -j$(nproc)

      - name: Run tests with coverage
        working-directory: build/test
        run: |
          # Run tests
          ctest --output-on-failure

          # Show generated coverage files for debugging
          find . -name "*.gcno" -o -name "*.gcda"

          # Capture coverage
          lcov --capture --directory . \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --exclude '/usr/*' \
               --exclude '*/test/*' \
               --ignore-errors empty,unused

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/test/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
  valgrind:
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Tools
        id: install
        run: |
          # LLVM/Clang toolchain
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ env.LLVM_VERSION }} main"
          sudo apt-get update
          sudo apt-get install -y \
          clang-${{ env.LLVM_VERSION }} \
          lld-${{ env.LLVM_VERSION }} \
          libc++-${{ env.LLVM_VERSION }}-dev \
          libc++abi-${{ env.LLVM_VERSION }}-dev \
          libtbb-dev \
          python3-pip \
          graphviz

          # Install specific valgrind version
          wget https://sourceware.org/pub/valgrind/valgrind-${{ env.VALGRIND_VERSION }}.tar.bz2
          tar xf valgrind-${{ env.VALGRIND_VERSION }}.tar.bz2
          cd valgrind-${{ env.VALGRIND_VERSION }}
          # Configure valgrind with Clang support
          ./configure CC=clang-${{ env.LLVM_VERSION }} CXX=clang++-${{ env.LLVM_VERSION }}
          make -j$(nproc)
          sudo make install
          cd ..

          # Python tools
          python3 -m pip install --upgrade pip
          python3 -m pip install \
          valgrind-log-parser==1.0.0 \
          gprof2dot==2021.2.21

      - name: Configure
        run: |
          cmake -S test -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
          -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
          -DCMAKE_CXX_FLAGS="\
              -g3 \
              -fno-inline-functions \
              -fno-optimize-sibling-calls \
              -fno-omit-frame-pointer \
              -O1 \
              -glldb" \
          -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld" \
          -DBUILD_TESTING=ON \
          -DBUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Setup Test Environment
        run: |
          echo "=== Valgrind Suppression Rules ===" > valgrind.supp
          # Add Clang-specific suppressions
          cat << EOF >> valgrind.supp
          {
          ignore_libcxx_leaks
          Memcheck:Leak
          ...
          obj:*/libc++.so.*
          }
          {
          ignore_llvm_leaks
          Memcheck:Leak
          ...
          obj:*/libLLVM*.so.*
          }
          EOF

      - name: Run Memory Analysis
        id: memcheck
        continue-on-error: true
        run: |
          cd build
          mkdir -p reports/memcheck

          echo "::group::Memory Check"

          ctest -T memcheck \
          --output-on-failure \
          --parallel $(nproc) \
          --timeout 300 \
          --overwrite MemoryCheckCommand=/usr/local/bin/valgrind \
          --overwrite MemoryCheckCommandOptions="\
              --tool=memcheck \
              --leak-check=full \
              --show-leak-kinds=all \
              --track-origins=yes \
              --num-callers=50 \
              --error-exitcode=1 \
              --xml=yes \
              --xml-file=reports/memcheck/test-\${TEST_NAME}.xml \
              --suppressions=../valgrind.supp \
              --demangle=yes"

          echo "::endgroup::"

      - name: Run Performance Analysis
        id: perfcheck
        if: always()
        continue-on-error: true
        run: |
          cd build
          mkdir -p reports/perf

          echo "::group::Performance Analysis"

          for bench in $(find . -type f -executable -name '*Benchmark'); do
          bench_name=$(basename $bench)

          # Callgrind with Clang-specific options
          timeout 20m valgrind --tool=callgrind \
              --dump-instr=yes \
              --collect-jumps=yes \
              --collect-systime=yes \
              --callgrind-out-file=reports/perf/${bench_name}_callgrind.out \
              --fn-skip="__cxx_*" \
              --fn-skip="std::*" \
              $bench

          # Cachegrind
          timeout 20m valgrind --tool=cachegrind \
              --branch-sim=yes \
              --I1=32768,8,64 \
              --D1=32768,8,64 \
              --LL=8388608,16,64 \
              --cachegrind-out-file=reports/perf/${bench_name}_cachegrind.out \
              $bench
          done

          echo "::endgroup::"

      - name: Generate Reports
        if: always()
        run: |
          cd build
          mkdir -p reports/summaries

          # Process memcheck results
          python3 -m valgrind_log_parser reports/memcheck/*.xml > reports/summaries/memory_summary.txt

          # Process performance results with demangling
          for report in reports/perf/*_callgrind.out; do
          base_name=$(basename $report _callgrind.out)
          callgrind_annotate --auto=yes --tree=both $report | c++filt > reports/summaries/${base_name}_callgrind.txt
          gprof2dot -f callgrind $report | dot -Tsvg -o reports/summaries/${base_name}_callgraph.svg
          done

          for report in reports/perf/*_cachegrind.out; do
          base_name=$(basename $report _cachegrind.out)
          cg_annotate $report | c++filt > reports/summaries/${base_name}_cachegrind.txt
          done

          # Create summary report
          {
          echo "=== Memory Analysis Summary ==="
          grep -A 5 "LEAK SUMMARY" reports/summaries/memory_summary.txt || true
          echo
          echo "=== Performance Analysis Summary ==="
          for f in reports/summaries/*_callgrind.txt; do
              echo "--- $(basename $f) ---"
              head -n 20 $f
              echo
          done
          } > reports/summary.txt

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            build/reports/summaries/
            valgrind.supp
          retention-days: 14

      - name: Check Results
        if: always()
        run: |
          cd build
          if grep -q "definitely lost: [1-9][0-9]*" reports/summaries/memory_summary.txt; then
          echo "::error::Memory leaks detected!"
          exit 1
          fi
