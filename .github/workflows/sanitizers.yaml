name: Sanitizers

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [Thread, Leak, Address, Undefined]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev
      - name: Configure
        run: cmake -Stest -Bbuild -DCMAKE_BUILD_TYPE=Debug -DUSE_SANITIZER=${{matrix.sanitizer}}
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: cd build && ctest --build-config Debug
