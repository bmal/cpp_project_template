name: Install

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev
      - name: Build and install library
        run: |
          cmake -S. -Bbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-march=native -mtune=native"
          sudo cmake --build build --target install -j$(nproc)
          rm -rf build
      - name: Configure test
        run: cmake -Stest -Bbuild -DTEST_INSTALLED_VERSION=1 -DCMAKE_BUILD_TYPE=Release
      - name: Build test
        run: cmake --build build --config Release -j$(nproc)
      - name: Run test
        run: cd build && ctest --build-config Release
