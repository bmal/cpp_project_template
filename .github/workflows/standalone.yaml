name: Standalone

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: List Build Directory
        run: |
          find build -type f -executable -print
          echo "Executable files:"
          find build -type f -executable -not -path "*/CMakeFiles/*" -not -path "*/_deps/*"

      - name: Run
        working-directory: build
        run: |
          # Get the name of the executable (excluding CMake executables)
          EXEC=$(find . -type f -executable -not -path "*/CMakeFiles/*" -not -path "*/_deps/*" | grep -v "cmake" | head -n 1)
          if [ -n "$EXEC" ]; then
            echo "Found executable: $EXEC"
            $EXEC
          else
            echo "No executable found"
            exit 1
          fi
