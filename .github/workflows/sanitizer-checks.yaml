name: Sanitizer Checks

on:
  workflow_call:

jobs:
  run-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, asan-gcc, tsan-gcc, fuzz]
    name: Sanitizer ${{ matrix.preset }}
    # Runtime options and suppressions come from the test presets, as they do locally.
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'cmake/toolchain/**', 'scripts/bootstrap.sh') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Bootstrap
        run: scripts/bootstrap.sh

      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.preset }}
