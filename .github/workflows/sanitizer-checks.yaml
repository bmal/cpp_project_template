name: Sanitizer Checks

on:
  workflow_call:

jobs:
  run-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, fuzz]
    name: Sanitizer ${{ matrix.preset }}
    env:
      ASAN_OPTIONS: detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:print_summary=1
      TSAN_OPTIONS: second_deadlock_stack=1:report_signal_unsafe=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'cmake/toolchain/**', 'scripts/bootstrap.sh') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Bootstrap
        run: scripts/bootstrap.sh

      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.preset }}
