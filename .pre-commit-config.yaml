# One hook config for every formatter and script linter; CI runs `pre-commit run --all-files` on it.
# clang-format and gersemi come from scripts/bootstrap.sh, so make format uses the same binaries.
exclude: ^tests/fuzz/corpus/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: scripts/format.sh
        language: system
        types_or: [c++, c]
      - id: gersemi
        name: gersemi
        entry: scripts/format.sh
        language: system
        types: [cmake]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: ^scripts/
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        files: ^(README\.md|CONTRIBUTING\.md|docs/)
